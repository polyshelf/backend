spring:
  application:
    name: polyshelf-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:  # todo: add service discovery
            - id: core
              uri: http://localhost:8081
              predicates:
                - Path=/api/core/**
            - id: auth
              uri: http://localhost:8082
              predicates:
                - Path=/api/auth/**
