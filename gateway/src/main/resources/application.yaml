spring:
  application:
    name: polyshelf-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth
              uri: ${POLYSHELF_AUTH_URL:http://localhost:8082}
              order: 0
              predicates:
                - Path=/auth/**
            - id: core
              uri: ${POLYSHELF_CORE_URL:http://localhost:8081}
              order: 1
              predicates:
                - Path=/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
