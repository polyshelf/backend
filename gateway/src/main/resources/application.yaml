spring:
  application:
    name: polyshelf-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:  # todo: add service discovery
            - id: core
              uri: ${POLYSHELF_CORE_URL:http://localhost:8081}
              predicates:
                - Path=/api/core/**
            - id: auth
              uri: ${POLYSHELF_AUTH_URL:http://localhost:8082}
              predicates:
                - Path=/api/auth/**
