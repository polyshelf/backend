name: polyshelf

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    mem_limit: 384m
    command: >
      postgres
      -c shared_buffers=128MB
      -c max_connections=50
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-polyshelf_db}
      POSTGRES_USER: ${POSTGRES_USER:-polyshelf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - ./pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  migrations:
    image: flyway/flyway:11
    command: migrate
    mem_limit: 384m
    environment:
      JAVA_TOOL_OPTIONS: -Xmx192m
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-polyshelf_db}
      FLYWAY_USER: ${POSTGRES_USER:-polyshelf_user}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ./flyway/migration:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  core:
    image: ghcr.io/polyshelf/backend-core:${TAG:?required}
    restart: unless-stopped
    mem_limit: 448m
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65 -XX:+ExitOnOutOfMemoryError
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-polyshelf_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-polyshelf_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "8"
      DATAMATRIX_ADAPTER_URL: ${DATAMATRIX_ADAPTER_URL:-http://localhost:8083}
      JWT_PUBLIC_KEY_LOCATION: file:/run/keys/public.pem
    volumes:
      - ${JWT_KEYS_DIR:?задайте JWT_KEYS_DIR в .env}/public.pem:/run/keys/public.pem:ro
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8081'"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 60s
    networks: [backend]

  datamatrix-adapter:
    image: ghcr.io/polyshelf/backend-datamatrix-adapter:${TAG:?required}
    restart: unless-stopped
    mem_limit: 448m
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65 -XX:+ExitOnOutOfMemoryError
      EXTERNAL_PROXY_ENABLED: ${EXTERNAL_PROXY_ENABLED:-false}
      EXTERNAL_PROXY_HOST: ${EXTERNAL_PROXY_HOST:-}
      EXTERNAL_PROXY_PORT: ${EXTERNAL_PROXY_PORT:-3128}
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8083'"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 40s
    networks: [backend]

  auth:
    image: ghcr.io/polyshelf/backend-auth:${TAG:?required}
    restart: unless-stopped
    mem_limit: 448m
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65 -XX:+ExitOnOutOfMemoryError
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-polyshelf_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-polyshelf_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "8"
      JWT_PRIVATE_KEY_LOCATION: file:/run/keys/private.pem
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
    volumes:
      - ${JWT_KEYS_DIR:?задайте JWT_KEYS_DIR в .env}/private.pem:/run/keys/private.pem:ro
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8082'"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 60s
    networks: [backend]

  gateway:
    image: ghcr.io/polyshelf/backend-gateway:${TAG:?required}
    restart: unless-stopped
    mem_limit: 384m
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65 -XX:+ExitOnOutOfMemoryError
      POLYSHELF_CORE_URL: http://core:8081
      POLYSHELF_AUTH_URL: http://auth:8082
    depends_on:
      core:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 60s
    networks: [backend]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      gateway:
        condition: service_healthy
    networks: [backend]

configs:
  caddyfile:
    content: |
      ${POLYSHELF_DOMAIN:-polyshelf.wedwin.ru} {
        encode zstd gzip
        reverse_proxy gateway:8080
      }

volumes:
  caddy_data:
  caddy_config:

networks:
  backend: