spring:
  application:
    name: polyshelf-core
  datasource:
    url: jdbc:postgresql://localhost:5432/polyshelf_db
    username: polyshelf_user
    password: polyshelf_password
  jpa:
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: ${JWT_PUBLIC_KEY_LOCATION:classpath:keys/public_local.pem}
          audiences:
            - polyshelf-api
services:
  datamatrix-adapter:
    base-url: ${DATAMATRIX_ADAPTER_URL:http://localhost:8083}
server:
  port: 8081

springdoc:
  swagger-ui:
    persist-authorization: true
    urls:
      - name: core
        url: /v3/api-docs
      - name: auth
        url: /auth-docs/v3/api-docs
    urls-primary-name: core

openfoodfacts:
  cron: "0 */20 * * * *"
  batch-size: 10000
  http:
    max-attempts: 3
    retry-delay: PT1S
    max-retry-delay: PT30S
    request-timeout: PT30S
    connect-timeout: PT10S
  reader:
    max-attempts: 2
    retry-delay: PT5S
