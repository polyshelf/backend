spring:
  application:
    name: polyshelf-core
  datasource:
    url: jdbc:postgresql://localhost:5432/polyshelf_db
    username: polyshelf_user
    password: polyshelf_password
  jpa:
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:keys/public.pem
          audiences:
            - polyshelf-api
server:
  port: 8081