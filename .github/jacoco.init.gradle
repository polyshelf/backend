allprojects {
  afterEvaluate { p ->
    if (p.plugins.hasPlugin('java')) {
      p.apply plugin: 'jacoco'
      p.jacoco { toolVersion = '0.8.14' }
      p.tasks.withType(Test).configureEach { finalizedBy p.tasks.named('jacocoTestReport') }
      p.tasks.named('jacocoTestReport') { t ->
        t.reports { csv.required = true }
        t.classDirectories.setFrom(t.classDirectories.files.collect {
          p.fileTree(dir: it, exclude: ['**/*Application.class', '**/models/**'])
        })
      }
      p.tasks.named('jacocoTestReport') { t ->
        t.reports { csv.required = true }
        t.classDirectories.setFrom(t.classDirectories.files.collect {
          p.fileTree(dir: it, exclude: ['**/*Application.class', '**/models/**'])
        })
      }
    }
  }
}
