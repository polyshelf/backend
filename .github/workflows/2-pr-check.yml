name: PR check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  MIN_COVERAGE: 40

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.d.outputs.matrix }}
      has: ${{ steps.d.outputs.has }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: d
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/detect-changed.sh "$BASE" "$HEAD" ...

  build:
    needs: detect
    if: needs.detect.outputs.has == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.detect.outputs.matrix) }}
    name: build (${{ matrix.dir }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Build (без тестов)
        run: |
          chmod +x gradlew
          ./gradlew :${{ matrix.dir }}:assemble --no-daemon

  test:
    needs: [detect, build]
    if: needs.detect.outputs.has == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.detect.outputs.matrix) }}
    name: test+coverage (${{ matrix.dir }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Test with JaCoCo
        run: |
          chmod +x gradlew
          ./gradlew :${{ matrix.dir }}:test :${{ matrix.dir }}:jacocoTestReport --no-daemon --init-script .github/jacoco.init.gradle
      - name: Check coverage
        working-directory: ${{ matrix.dir }}
        run: |
          files=$(find . -path '*jacoco*' -name '*.csv')
          if [ -z "$files" ]; then
            echo "### ${{ matrix.dir }}: нет кода для измерения покрытия" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cov=$(cat $files | awk -F, '$1!="GROUP"{m+=$4;c+=$5} END{if(m+c==0)print "n/a"; else printf "%.2f", c*100/(m+c)}')
          if [ "$cov" = "n/a" ]; then
            echo "### ${{ matrix.dir }}: нет кода для измерения покрытия" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "### ${{ matrix.dir }}: coverage ${cov}% (min ${MIN_COVERAGE}%)" >> "$GITHUB_STEP_SUMMARY"
          echo "Coverage: ${cov}%"
          if awk -v c="$cov" -v t="$MIN_COVERAGE" 'BEGIN{exit !(c < t)}'; then
            echo "::error::Покрытие ${cov}% меньше ${MIN_COVERAGE}%"
            exit 1
          fi

  integration-test:
    needs: [detect, build]
    if: needs.detect.outputs.has == 'true'
    runs-on: ubuntu-latest
    name: integration tests
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Run integration tests
        run: |
          chmod +x gradlew
          ./gradlew :integration-tests:integrationTest --no-daemon
