name: PR check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  MIN_COVERAGE: 50

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.d.outputs.matrix }}
      has: ${{ steps.d.outputs.has }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: d
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/detect-changed.sh "$BASE" "$HEAD" ...

  test:
    needs: detect
    if: needs.detect.outputs.has == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.detect.outputs.matrix) }}
    name: build+test+coverage (${{ matrix.dir }})
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: polyshelf_db
          POSTGRES_USER: polyshelf_user
          POSTGRES_PASSWORD: polyshelf_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U polyshelf_user -d polyshelf_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: deps-${{ matrix.dir }}-${{ hashFiles(format('{0}/**/pom.xml', matrix.dir), format('{0}/**/*.gradle*', matrix.dir), format('{0}/**/gradle-wrapper.properties', matrix.dir), format('{0}/gradle/libs.versions.toml', matrix.dir)) }}
          restore-keys: deps-${{ matrix.dir }}-
      - name: Build and test with JaCoCo
        env:
          DIR: ${{ matrix.dir }}
        run: |
          cd "$DIR"
          if [ -f pom.xml ]; then
            chmod +x mvnw 2>/dev/null || true
            MVN=$([ -x ./mvnw ] && echo ./mvnw || echo mvn)
            J=org.jacoco:jacoco-maven-plugin:0.8.14
            $MVN -B $J:prepare-agent verify $J:report
          else
            chmod +x gradlew
            cat > "$RUNNER_TEMP/jacoco.init.gradle" <<'GRADLE'
          allprojects {
            afterEvaluate { p ->
              if (p.plugins.hasPlugin('java')) {
                p.apply plugin: 'jacoco'
                p.jacoco { toolVersion = '0.8.14' }
                p.tasks.withType(Test).configureEach { finalizedBy p.tasks.named('jacocoTestReport') }
                p.tasks.named('jacocoTestReport') { reports { csv.required = true } }
              }
            }
          }
          GRADLE
            ./gradlew build --no-daemon --init-script "$RUNNER_TEMP/jacoco.init.gradle"
          fi
      - name: Check coverage
        env:
          DIR: ${{ matrix.dir }}
        run: |
          files=$(find "$DIR" -path '*jacoco*' -name '*.csv')
          if [ -z "$files" ]; then
            echo "::error::JaCoCo отчёты не найдены (нет тестов/классов?)"
            exit 1
          fi
          cov=$(cat $files | awk -F, '$1!="GROUP"{m+=$4;c+=$5} END{if(m+c==0)print 0; else printf "%.2f", c*100/(m+c)}')
          echo "### $DIR: coverage ${cov}% (min ${MIN_COVERAGE}%)" >> "$GITHUB_STEP_SUMMARY"
          echo "Coverage: ${cov}%"
          if awk -v c="$cov" -v t="$MIN_COVERAGE" 'BEGIN{exit !(c < t)}'; then
            echo "::error::Покрытие ${cov}% меньше ${MIN_COVERAGE}%"
            exit 1
          fi

  docker:
    needs: detect
    if: needs.detect.outputs.has == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.detect.outputs.matrix) }}
    name: docker build (${{ matrix.dir }})
    steps:
      - uses: actions/checkout@v5
      - name: Docker build
        env:
          DIR: ${{ matrix.dir }}
        run: |
          if [ -f "$DIR/Dockerfile" ]; then
            docker build -t "polyshelf-$DIR:ci" "$DIR"
          fi