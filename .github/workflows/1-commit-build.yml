name: Commit build & test

on:
  push:
    branches: ['**']

concurrency:
  group: commit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.d.outputs.matrix }}
      has: ${{ steps.d.outputs.has }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: d
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: bash .github/scripts/detect-changed.sh "$BEFORE" "$SHA" ..

  build:
    needs: detect
    if: needs.detect.outputs.has == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.detect.outputs.matrix) }}
    name: build (${{ matrix.dir }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Build (без тестов)
        run: |
          chmod +x gradlew
          ./gradlew :${{ matrix.dir }}:assemble --no-daemon

  test:
    needs: [detect, build]
    if: needs.detect.outputs.has == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.detect.outputs.matrix) }}
    name: test (${{ matrix.dir }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Test
        run: |
          chmod +x gradlew
          ./gradlew :${{ matrix.dir }}:test --no-daemon