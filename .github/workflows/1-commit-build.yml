name: Commit build & test

on:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: commit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.d.outputs.matrix }}
      has: ${{ steps.d.outputs.has }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: d
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: bash .github/scripts/detect-changed.sh "$BEFORE" "$SHA" ..

  build-test:
    needs: detect
    if: needs.detect.outputs.has == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.detect.outputs.matrix) }}
    name: build+test (${{ matrix.dir }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: deps-${{ matrix.dir }}-${{ hashFiles(format('{0}/**/pom.xml', matrix.dir), format('{0}/**/*.gradle*', matrix.dir), format('{0}/**/gradle-wrapper.properties', matrix.dir), format('{0}/gradle/libs.versions.toml', matrix.dir)) }}
          restore-keys: deps-${{ matrix.dir }}-
      - name: Build and test
        env:
          DIR: ${{ matrix.dir }}
        run: |
          cd "$DIR"
          if [ -f pom.xml ]; then
            chmod +x mvnw 2>/dev/null || true
            MVN=$([ -x ./mvnw ] && echo ./mvnw || echo mvn)
            $MVN -B clean verify
          else
            chmod +x gradlew
            ./gradlew build --no-daemon
          fi